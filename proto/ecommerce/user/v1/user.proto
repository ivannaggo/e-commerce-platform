syntax = "proto3";

package ecommerce.user.v1;

option go_package = "github.com/ivannaggo/e-commerce-platform/proto/gen/go/ecommerce/user/v1;userv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service UserService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty);

  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
  rpc VerifyEmail(VerifyEmailRequest) returns (google.protobuf.Empty);
  rpc DeactivateUser(DeactivateUserRequest) returns (google.protobuf.Empty);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_DEACTIVATED = 4;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_CUSTOMER = 1;
  USER_ROLE_SUPPORT = 2;
  USER_ROLE_ADMIN = 3;
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  UserStatus status = 5;
  bool email_verified = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message UserDetails {
  User user = 1;
  string phone = 2;
  repeated UserRole roles = 3;
  google.protobuf.Timestamp last_login_at = 4;
}

message Session {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in_seconds = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message Pagination {
  int32 page_size = 1;
  string page_token = 2;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string phone = 3;
  string first_name = 4;
  string last_name = 5;
  string idempotency_key = 6;
}

message RegisterUserResponse {
  User user = 1;
  Session session = 2;
}

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string ip_address = 4;
}

message AuthenticateUserResponse {
  User user = 1;
  Session session = 2;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  Session session = 1;
}

message RevokeSessionRequest {
  string refresh_token = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  UserDetails user = 1;
}

message ListUsersRequest {
  Pagination pagination = 1;
  UserStatus status = 2;
  string email = 3;
  string name = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message UpdateUserProfileRequest {
  string user_id = 1;
  google.protobuf.StringValue phone = 2;
  google.protobuf.StringValue first_name = 3;
  google.protobuf.StringValue last_name = 4;
}

message UpdateUserProfileResponse {
  UserDetails user = 1;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message VerifyEmailRequest {
  string user_id = 1;
  string verification_token = 2;
}

message DeactivateUserRequest {
  string user_id = 1;
  string reason = 2;
}